version: '3.8'

services:
  flask-app:
    image: python:3.9-slim
    container_name: flask_app
    ports:
      - "127.0.0.1:8443:8443"
    environment:
      APP_HOST: "0.0.0.0"
      APP_PORT: "8443"
    volumes:
      - ..:/app
      - ../data/logs:/app/data/logs
    working_dir: /app
    env_file:
      - ../.env
    command: >
      sh -c "apt-get update && apt-get install -y --no-install-recommends openssl
             && chmod +x ./scripts/generate_certs.sh
             && ./scripts/generate_certs.sh
             && pip install -r requirements.txt
             && python app.py"
