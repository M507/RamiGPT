# RamiGPT privilege-escalation lab targets.
# One image (ramigpt-bench-base); each service only changes SSH_PORT + MISCONFIG.
# Host networking (no publish/DNAT): sshd binds SSH_PORT directly on the lab host
# — same pattern for every target (see bench-sudo-vim).
# Credentials: lowpriv / password
# Ports: 2170–2349 (see targets.py); host-network sshd per service.

x-bench: &bench
  image: ramigpt-bench-base:latest
  build:
    context: .
    dockerfile: Dockerfile
  network_mode: host
  restart: unless-stopped

services:
  bench-sudo-vim:
    <<: *bench
    container_name: ramigpt_bench_sudo_vim
    environment:
      SSH_PORT: "2211"
      MISCONFIG: "sudo:/usr/bin/vim"

  bench-sudo-awk:
    <<: *bench
    container_name: ramigpt_bench_sudo_awk
    environment:
      SSH_PORT: "2212"
