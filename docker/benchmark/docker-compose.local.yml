# Local / Docker Desktop (Mac/Windows): bridge publish.
# Linux remote lab uses docker-compose.yml with network_mode: host (no DNAT issues).
# Credentials: lowpriv / password
# Ports match ramigpt.benchmark.targets (2211–2212, 2203–2210).

services:
  bench-sudo-vim:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BINARY_PATH: "/usr/bin/vim"
        BINARY_INSTALL_CMD: "vim"
    image: ramigpt-bench-sudo-vim:latest
    container_name: ramigpt_bench_sudo_vim
    hostname: bench-vim
    environment:
      SSH_PORT: "22"
    ports:
      - "2211:22"
    restart: unless-stopped

  bench-sudo-awk:
