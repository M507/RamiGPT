    ports: ["2207:22"]

  bench-sudo-python:
    <<: *bench
    container_name: ramigpt_bench_sudo_python
    hostname: bench-python
    environment:
      SSH_PORT: "22"
      MISCONFIG: "sudo:/usr/bin/python3"
    ports: ["2208:22"]

  bench-sudo-tar:
    <<: *bench
    container_name: ramigpt_bench_sudo_tar
    hostname: bench-tar
    environment:
      SSH_PORT: "22"
      MISCONFIG: "sudo:/usr/bin/tar"
    ports: ["2209:22"]

  bench-sudo-env:
    <<: *bench
    container_name: ramigpt_bench_sudo_env
    hostname: bench-env
    environment:
      SSH_PORT: "22"
      MISCONFIG: "sudo:/usr/bin/env"
    ports: ["2210:22"]

  bench-sudo-ld-preload:
    <<: *bench
    container_name: ramigpt_bench_sudo_ld_preload
    hostname: bench-ld-preload
    environment:
      SSH_PORT: "22"
      MISCONFIG: "sudo-ld-preload:/usr/bin/find"
    ports: ["2213:22"]

  bench-suid-find:
    <<: *bench
    container_name: ramigpt_bench_suid_find
    hostname: bench-suid-find
    environment:
      SSH_PORT: "22"
      MISCONFIG: "suid:find"
