# Local / Docker Desktop (Mac/Windows): bridge publish.
# Same image + MISCONFIG model as docker-compose.yml (Linux host network).
# Credentials: lowpriv / password

x-bench: &bench
  image: ramigpt-bench-base:latest
  build:
    context: .
    dockerfile: Dockerfile
  environment:
    SSH_PORT: "22"
  restart: unless-stopped

services:
  bench-sudo-vim:
    <<: *bench
    container_name: ramigpt_bench_sudo_vim
    hostname: bench-vim
    environment:
      SSH_PORT: "22"
      MISCONFIG: "sudo:/usr/bin/vim"
    ports: ["2211:22"]

  bench-sudo-awk:
    <<: *bench
    container_name: ramigpt_bench_sudo_awk
    hostname: bench-awk
