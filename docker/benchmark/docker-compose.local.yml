    ports: ["2217:22"]

  bench-cap-python:
    <<: *bench
    container_name: ramigpt_bench_cap_python
    hostname: bench-cap-python
    cap_add: ["SETFCAP"]
    environment:
      SSH_PORT: "22"
      MISCONFIG: "cap-setuid:python3"
    ports: ["2218:22"]

  bench-python-hijack:
    <<: *bench
    container_name: ramigpt_bench_python_hijack
