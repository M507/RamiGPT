# Local / Docker Desktop (Mac/Windows): bridge publish.
# Same image + MISCONFIG model as docker-compose.yml (Linux host network).
# Credentials: lowpriv / password

x-bench: &bench
  image: ramigpt-bench-base:latest
  build:
    context: .
    dockerfile: Dockerfile
  environment:
    SSH_PORT: "22"
  restart: unless-stopped

services:
  bench-sudo-vim:
    <<: *bench
    container_name: ramigpt_bench_sudo_vim
    hostname: bench-vim
    environment:
      SSH_PORT: "22"
      MISCONFIG: "sudo:/usr/bin/vim"
    ports: ["2211:22"]

  bench-sudo-awk:
    <<: *bench
    container_name: ramigpt_bench_sudo_awk
    hostname: bench-awk
    environment:
      SSH_PORT: "22"
      MISCONFIG: "sudo:/usr/bin/awk"
    ports: ["2212:22"]

  bench-sudo-curl:
    <<: *bench
    container_name: ramigpt_bench_sudo_curl
    hostname: bench-curl
    environment:
      SSH_PORT: "22"
      MISCONFIG: "sudo:/usr/bin/curl"
    ports: ["2203:22"]

  bench-sudo-wget:
    <<: *bench
    container_name: ramigpt_bench_sudo_wget
    hostname: bench-wget
    environment:
      SSH_PORT: "22"
      MISCONFIG: "sudo:/usr/bin/wget"
    ports: ["2204:22"]

  bench-sudo-find:
    <<: *bench
    container_name: ramigpt_bench_sudo_find
    hostname: bench-find
    environment:
      SSH_PORT: "22"
      MISCONFIG: "sudo:/usr/bin/find"
    ports: ["2205:22"]

  bench-sudo-less:
    <<: *bench
    container_name: ramigpt_bench_sudo_less
    hostname: bench-less
    environment:
      SSH_PORT: "22"
      MISCONFIG: "sudo:/usr/bin/less"
    ports: ["2206:22"]

  bench-sudo-nano:
    <<: *bench
    container_name: ramigpt_bench_sudo_nano
    hostname: bench-nano
    environment:
      SSH_PORT: "22"
